<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>#chaoscore — Accesso</title>
  <meta name="theme-color" content="#13070a" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050505;color:#e7e0d2}
    body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .page{
      min-height:100vh;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:max(72px,calc(env(safe-area-inset-top,0px) + 24px)) 24px max(24px,env(safe-area-inset-bottom,0px));
      background:
        radial-gradient(circle at 20% 0%,rgba(139,23,23,.34),transparent 35%),
        radial-gradient(circle at 80% 20%,rgba(231,224,210,.08),transparent 28%),
        linear-gradient(180deg,#0c0908 0%,#030303 72%);
      overflow-x:hidden;
    }
    .card{
      width:min(680px,100%);
      border:1px solid rgba(231,224,210,.2);
      border-radius:28px;
      padding:clamp(24px,6vw,48px);
      background:linear-gradient(135deg,rgba(231,224,210,.08),rgba(231,224,210,.025)),rgba(0,0,0,.34);
      box-shadow:0 32px 110px rgba(0,0,0,.48);
      position:relative;
      overflow:hidden;
    }
    .stamp{
      position:absolute;right:-20px;top:26px;transform:rotate(14deg);
      border:3px solid rgba(179,34,34,.5);color:rgba(179,34,34,.58);
      border-radius:10px;padding:4px 14px;font-weight:900;letter-spacing:.08em;
      font-size:clamp(1.9rem,7vw,4.4rem);pointer-events:none
    }
    .kicker{color:rgba(231,224,210,.56);text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;margin-bottom:14px;max-width:calc(100% - 88px)}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.7rem,11vw,6rem);line-height:.86;letter-spacing:-.08em;margin:0 0 18px;text-transform:uppercase}
    .message{color:rgba(231,224,210,.78);line-height:1.7;margin:0 0 18px;font-size:1rem}
    .info{border:1px solid rgba(231,224,210,.18);border-radius:18px;padding:16px;background:rgba(255,255,255,.045);margin-top:18px}
    .info+.info{background:rgba(255,255,255,.035);margin-top:12px}
    .info-title{color:#d8f7cf;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;margin-bottom:8px}
    .info-copy{color:rgba(231,224,210,.72);line-height:1.65}
    .actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:22px;width:100%}
    .button{
      display:inline-flex;align-items:center;justify-content:center;min-height:48px;
      border:1px solid rgba(231,224,210,.22);border-radius:999px;padding:13px 16px;
      color:#e7e0d2;text-decoration:none;text-transform:uppercase;letter-spacing:.1em;
      font-size:.72rem;font-weight:900;line-height:1.25;text-align:center;
      overflow-wrap:anywhere;background:rgba(231,224,210,.07)
    }
    .primary{border-color:rgba(216,247,207,.46);background:linear-gradient(180deg,rgba(216,247,207,.18),rgba(216,247,207,.06)),rgba(20,32,25,.9);color:#f4fff1}
    .platform{border-color:rgba(30,215,96,.42);background:rgba(9,18,12,.7)}
    .secondary{background:rgba(0,0,0,.2)}
    .loading{opacity:.72}
    @media(min-width:620px){.actions{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}.full{grid-column:1/-1}}
    @media(max-width:520px){
      .page{padding:max(64px,calc(env(safe-area-inset-top,0px) + 18px)) 14px max(18px,env(safe-area-inset-bottom,0px));align-items:start}
      .card{border-radius:24px;padding:24px 16px 18px}
      .stamp{right:-18px;top:18px;font-size:clamp(1.6rem,13vw,3.2rem)}
      h1{font-size:clamp(2.45rem,18vw,4.25rem)}
      .message,.info-copy{font-size:.9rem}
      .button{width:100%;min-height:46px;padding:12px 13px;font-size:.66rem;letter-spacing:.08em}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" id="gate">
      <div class="stamp" aria-hidden="true">LOCKED</div>
      <div class="kicker">Private NFC Album Access</div>
      <h1>#chaoscore<br>Locked</h1>
      <p class="message loading" id="message">Verifica accesso in corso...</p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://giixvsfwsguudrvvbmkj.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Ae2dmdo-KYyNxcVntZg_2Q_xkWq5Bzm";

    const client = window.supabase?.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
    );

    const gate = document.getElementById("gate");
    const message = document.getElementById("message");

    function renderLocked({ loggedIn }) {
      message.classList.remove("loading");
      message.textContent = loggedIn
        ? "Il tuo account non ha ancora un #CHAOSCORE TAG attivo."
        : "Accedi per verificare il tuo accesso oppure acquista un #CHAOSCORE TAG.";

      gate.insertAdjacentHTML("beforeend", `
        <div class="info">
          <div class="info-title">Serve un #CHAOSCORE TAG</div>
          <div class="info-copy">Il player esclusivo si sblocca solo con un tag fisico riscattato e collegato al tuo account LOOK APP.</div>
        </div>
        <div class="actions">
          <a class="button primary" href="/shop#chaoscore-tag">Acquista ora — a partire da €4,99</a>
          <a class="button platform" href="https://orcd.co/chaoscore" target="_blank" rel="noopener noreferrer">Ascolta sulle piattaforme</a>
          ${
            loggedIn
              ? `<a class="button secondary full" href="/claim">Hai un TAG? Riscattalo</a>`
              : `<a class="button secondary full" href="/auth?mode=login&next=%2Fchaoscore">Accedi per verificare il TAG</a>`
          }
          <a class="button secondary full" href="/">← Back to Busta Files</a>
        </div>
      `);
    }

    async function checkAccess() {
      if (!client) {
        renderLocked({ loggedIn: false });
        return;
      }

      const { data: { session } } = await client.auth.getSession();

      if (!session?.user) {
        renderLocked({ loggedIn: false });
        return;
      }

      const { data, error } = await client.rpc("get_my_chaos_access");
      const access = Array.isArray(data) ? data[0] : data;

      if (!error && access?.chaos_verified === true) {
        window.location.replace("/chaoscore/player");
        return;
      }

      renderLocked({ loggedIn: true });
    }

    checkAccess().catch(() => renderLocked({ loggedIn: false }));
  </script>
  <script src="/look-instagram-follow.js?v=1"></script>
</body>
</html>
